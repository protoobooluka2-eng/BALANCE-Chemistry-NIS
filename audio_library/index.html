<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BALANCE Chemistry — Gemini Sulafat Audio Player & Audition Suite</title>
  <meta name="description" content="Interactive player and audition console for all 265 educational voice narration clips generated with Google Gemini TTS (Sulafat) across Labs 01-09.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: #111827;
      --bg-card-hover: #1e293b;
      --border: #1f293d;
      --border-highlight: #38bdf8;
      --accent: #0ea5e9;
      --accent-glow: rgba(14, 165, 233, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --success: #10b981;
      --purple: #a855f7;
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 120px;
    }

    header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
    }

    .header-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--accent-glow);
      font-size: 22px;
    }

    .brand-title h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tag-sulafat {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #c084fc;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .tag-model {
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(14, 165, 233, 0.4);
      color: #38bdf8;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .brand-title p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .stats-pills {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-pill {
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-pill strong {
      color: var(--success);
      font-weight: 700;
    }

    .btn-action {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    /* Controls Bar */
    .controls-bar {
      max-width: 1400px;
      margin: 24px auto 16px;
      padding: 0 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }

    .lab-filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tab-btn {
      background: #111827;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover {
      background: #1f2937;
      color: #fff;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .search-box {
      position: relative;
      min-width: 280px;
    }
    .search-input {
      width: 100%;
      background: #111827;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px 8px 36px;
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent);
    }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 14px;
    }

    /* Content Area */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    .clips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .clip-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s;
      position: relative;
    }
    .clip-card:hover {
      background: var(--bg-card-hover);
      border-color: #334155;
      transform: translateY(-2px);
    }
    .clip-card.playing {
      border-color: var(--border-highlight);
      box-shadow: 0 0 16px var(--accent-glow);
      background: #131d2e;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .lab-badge {
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .event-badge {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .var-badge {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10.5px;
      font-family: var(--font-mono);
      font-weight: 700;
    }

    .script-text {
      font-size: 13.5px;
      line-height: 1.5;
      color: #e2e8f0;
      font-style: italic;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .audio-stats {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .btn-play-card {
      background: #0284c7;
      color: #fff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-play-card:hover {
      background: #0ea5e9;
      transform: scale(1.08);
    }
    .clip-card.playing .btn-play-card {
      background: var(--purple);
    }

    /* Sticky Bottom Audio Bar */
    .audio-player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 12px 24px;
      z-index: 200;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
    }

    .player-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .player-info {
      flex: 1;
      min-width: 200px;
    }
    .player-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .player-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 500px;
      margin-top: 2px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .player-btn:hover {
      background: #334155;
    }
    .player-btn.play-main {
      background: var(--accent);
      width: 44px;
      height: 44px;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .scrubber-container {
      flex: 2;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .scrubber-slider {
      flex: 1;
      height: 5px;
      -webkit-appearance: none;
      background: #334155;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    .scrubber-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    .time-display {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      min-width: 75px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand">
        <div class="logo-badge">🎙️</div>
        <div class="brand-title">
          <h1>
            BALANCE Chemistry — Audio Audition Suite
            <span class="tag-sulafat">Voice: Sulafat</span>
            <span class="tag-model">Google Gemini TTS</span>
          </h1>
          <p>Educational voice narration library across all 9 virtual chemistry laboratories</p>
        </div>
      </div>

      <div class="stats-pills">
        <div class="stat-pill">Generated: <strong id="stat-count">265 / 265</strong></div>
        <div class="stat-pill">Coverage: <strong>100% Ready</strong></div>
        <div class="stat-pill">Total Size: <strong>~30.2 MB</strong></div>
        <button class="btn-action" id="btn-random-audition">🎲 Play Random Clip</button>
      </div>
    </div>
  </header>

  <div class="controls-bar">
    <div class="lab-filter-tabs" id="lab-tabs">
      <button class="tab-btn active" data-lab="all">All Labs (265)</button>
      <button class="tab-btn" data-lab="lab01">Lab 01 (32)</button>
      <button class="tab-btn" data-lab="lab02">Lab 02 (37)</button>
      <button class="tab-btn" data-lab="lab03">Lab 03 (22)</button>
      <button class="tab-btn" data-lab="lab04">Lab 04 (26)</button>
      <button class="tab-btn" data-lab="lab05">Lab 05 (22)</button>
      <button class="tab-btn" data-lab="lab06">Lab 06 (30)</button>
      <button class="tab-btn" data-lab="lab07">Lab 07 (23)</button>
      <button class="tab-btn" data-lab="lab08">Lab 08 (30)</button>
      <button class="tab-btn" data-lab="lab09">Lab 09 (43)</button>
    </div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" class="search-input" placeholder="Search event or script text...">
    </div>
  </div>

  <main>
    <div class="clips-grid" id="clips-grid">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <div class="audio-player-bar">
    <div class="player-inner">
      <div class="player-info">
        <div class="player-title" id="player-title">Select a clip to play</div>
        <div class="player-subtitle" id="player-subtitle">No clip selected</div>
      </div>

      <div class="player-controls">
        <button class="player-btn" id="btn-prev" title="Previous clip">⏮</button>
        <button class="player-btn play-main" id="btn-play-pause">▶</button>
        <button class="player-btn" id="btn-next" title="Next clip">⏭</button>
      </div>

      <div class="scrubber-container">
        <input type="range" class="scrubber-slider" id="scrubber" value="0" min="0" max="100">
        <span class="time-display" id="time-display">0:00 / 0:00</span>
      </div>

      <div style="display:flex; align-items:center; gap:8px;">
        <label style="font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:4px; cursor:pointer;">
          <input type="checkbox" id="chk-autoplay"> Autoplay Next
        </label>
      </div>
    </div>
  </div>

  <audio id="global-audio" preload="auto"></audio>

  <script>
    const LAB_TITLES = {
      lab01: "Water Electrolysis",
      lab02: "Copper Sulfate Crystals",
      lab03: "Precipitation Reaction",
      lab04: "Acid-Base Neutralisation",
      lab05: "Decomposition of NH₄Cl",
      lab06: "Ammonium Ion Test",
      lab07: "Cobalt Chloride Equilibrium",
      lab08: "Nitrogen Dioxide Equilibrium",
      lab09: "Haber Process Optimisation"
    };

    let allClips = [];
    let filteredClips = [];
    let currentIndex = -1;
    const audio = document.getElementById('global-audio');
    const playPauseBtn = document.getElementById('btn-play-pause');
    const scrubber = document.getElementById('scrubber');
    const timeDisplay = document.getElementById('time-display');
    const playerTitle = document.getElementById('player-title');
    const playerSubtitle = document.getElementById('player-subtitle');
    const clipsGrid = document.getElementById('clips-grid');
    const chkAutoplay = document.getElementById('chk-autoplay');

    let currentLabFilter = 'all';
    let searchQuery = '';

    // Load Manifest
    async function loadClips() {
      try {
        const resp = await fetch('sulafat_manifest.json');
        const data = await resp.json();
        
        allClips = Object.entries(data.clips || {}).map(([key, item]) => {
          const lab = item.lab_id;
          const evt = item.event_id;
          const v = item.variation;
          return {
            key,
            lab_id: lab,
            lab_title: LAB_TITLES[lab] || lab,
            event_id: evt,
            variation: v,
            script: item.script,
            size_bytes: item.size_bytes || 0,
            model: item.voice_model || 'gemini-3.8-flash-lite-tts',
            url: `clips/${lab}/${evt}_v${v}.mp3`
          };
        });

        // Sort by lab, event, variation
        allClips.sort((a, b) => a.key.localeCompare(b.key));
        applyFilters();
      } catch (err) {
        clipsGrid.innerHTML = `<div class="empty-state">Failed to load manifest: ${err.message}</div>`;
      }
    }

    function applyFilters() {
      filteredClips = allClips.filter(clip => {
        const matchLab = (currentLabFilter === 'all' || clip.lab_id === currentLabFilter);
        const matchSearch = (!searchQuery || 
          clip.script.toLowerCase().includes(searchQuery) ||
          clip.event_id.toLowerCase().includes(searchQuery) ||
          clip.key.toLowerCase().includes(searchQuery)
        );
        return matchLab && matchSearch;
      });

      renderGrid();
    }

    function renderGrid() {
      if (filteredClips.length === 0) {
        clipsGrid.innerHTML = `<div class="empty-state">No clips match your search/filter criteria.</div>`;
        return;
      }

      clipsGrid.innerHTML = filteredClips.map((clip, idx) => {
        const isPlaying = (currentIndex !== -1 && filteredClips[currentIndex] && filteredClips[currentIndex].key === clip.key);
        const sizeKb = Math.round(clip.size_bytes / 1024);
        return `
          <div class="clip-card ${isPlaying ? 'playing' : ''}" data-idx="${idx}" id="card-${idx}">
            <div class="card-meta">
              <div style="display:flex; align-items:center; gap:6px;">
                <span class="lab-badge">${clip.lab_id.toUpperCase()}</span>
                <span class="event-badge" title="${clip.event_id}">${clip.event_id}</span>
              </div>
              <span class="var-badge">v${clip.variation}</span>
            </div>
            <div class="script-text">"${clip.script}"</div>
            <div class="card-footer">
              <div class="audio-stats">
                ${sizeKb} KB • Sulafat • ${clip.lab_title}
              </div>
              <button class="btn-play-card" onclick="playIndex(${idx})" title="Play this clip">
                ${isPlaying && !audio.paused ? '⏸' : '▶'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function playIndex(idx) {
      if (idx < 0 || idx >= filteredClips.length) return;

      if (currentIndex === idx && !audio.paused) {
        audio.pause();
        updatePlayState();
        return;
      }

      currentIndex = idx;
      const clip = filteredClips[idx];
      audio.src = clip.url;
      audio.play().catch(e => console.warn("Audio play prevented:", e));

      playerTitle.innerHTML = `<span class="lab-badge">${clip.lab_id.toUpperCase()}</span> ${clip.event_id} (v${clip.variation}) — ${clip.lab_title}`;
      playerSubtitle.textContent = `"${clip.script}"`;
      updatePlayState();

      // Scroll card into view
      const card = document.getElementById(`card-${idx}`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function updatePlayState() {
      const isPlaying = !audio.paused;
      playPauseBtn.textContent = isPlaying ? '⏸' : '▶';

      document.querySelectorAll('.clip-card').forEach((card, i) => {
        const cardIdx = parseInt(card.getAttribute('data-idx'));
        const btn = card.querySelector('.btn-play-card');
        if (cardIdx === currentIndex) {
          card.classList.add('playing');
          if (btn) btn.textContent = isPlaying ? '⏸' : '▶';
        } else {
          card.classList.remove('playing');
          if (btn) btn.textContent = '▶';
        }
      });
    }

    // Audio events
    audio.addEventListener('play', updatePlayState);
    audio.addEventListener('pause', updatePlayState);
    audio.addEventListener('ended', () => {
      updatePlayState();
      if (chkAutoplay.checked && currentIndex + 1 < filteredClips.length) {
        playIndex(currentIndex + 1);
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      scrubber.value = pct;
      timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    });

    scrubber.addEventListener('input', () => {
      if (audio.duration) {
        audio.currentTime = (scrubber.value / 100) * audio.duration;
      }
    });

    playPauseBtn.addEventListener('click', () => {
      if (currentIndex === -1 && filteredClips.length > 0) {
        playIndex(0);
        return;
      }
      if (audio.paused) audio.play();
      else audio.pause();
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      if (currentIndex + 1 < filteredClips.length) playIndex(currentIndex + 1);
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
      if (currentIndex > 0) playIndex(currentIndex - 1);
    });

    document.getElementById('btn-random-audition').addEventListener('click', () => {
      if (filteredClips.length === 0) return;
      const rand = Math.floor(Math.random() * filteredClips.length);
      playIndex(rand);
    });

    // Tab Filters
    document.getElementById('lab-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentLabFilter = btn.getAttribute('data-lab');
      applyFilters();
    });

    // Search
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      applyFilters();
    });

    function formatTime(secs) {
      if (isNaN(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    loadClips();
  </script>
</body>
</html>
